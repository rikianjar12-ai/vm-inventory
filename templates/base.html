<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VM Inventory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">VM</div>
                <div>
                    <p class="brand-kicker">Datacenter Operations</p>
                    <h1>Inventory Server</h1>
                </div>
            </div>
            <nav class="nav">
                <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('tambah_vm') }}" class="{% if request.endpoint == 'tambah_vm' %}active{% endif %}">Tambah VM</a>
                <a href="{{ url_for('kelola_kolom') }}" class="{% if request.endpoint == 'kelola_kolom' %}active{% endif %}">Kelola Kolom</a>
            </nav>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-stack">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
