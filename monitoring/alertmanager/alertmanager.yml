# Dihasilkan dari template + .env. Regenerate:
#   node scripts/render-alertmanager.mjs
# Saat Telegram/email belum diisi, receiver kosong (alert tetap dievaluasi).
global:
  resolve_timeout: 2m
# smtp belum diisi

route:
  receiver: default
  group_by: ["alertname", "server_id"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 1h
    - matchers:
        - severity="high"
      receiver: default
      repeat_interval: 2h

inhibit_rules:
  - source_matchers:
      - alertname="ServerDown"
    target_matchers:
      - severity=~"high|warning|critical"
    equal: ["instance"]

receivers:
  - name: default
    # Belum ada Telegram/email di .env — alert tetap dievaluasi, tanpa kirim keluar.
  - name: critical
    # Belum ada Telegram/email di .env — alert tetap dievaluasi, tanpa kirim keluar.
