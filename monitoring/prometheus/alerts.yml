groups:
  - name: kesehatan-server
    rules:
      # Hanya server yang PERNAH UP (punya agent) lalu mati.
      # Target yang belum pernah berhasil di-scrape (belum install agent) tidak memicu alert.
      - alert: ServerDown
        expr: |
          (
            up{job=~"node|windows"} == 0
          )
          and
          (
            max_over_time(up{job=~"node|windows"}[2d]) == 1
          )
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Server {{ $labels.server_id }} tidak merespons"
          description: "Exporter di {{ $labels.instance }} down selama lebih dari 3 menit. Pastikan agent terpasang dan port 9100/9182 terbuka."

      - alert: LoadTinggi
        expr: node_load1 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load tinggi di {{ $labels.server_id }}"
          description: "Load 1 menit = {{ $value | humanize }} (melebihi 1.5x jumlah CPU)."

      - alert: CpuTinggi
        expr: |
          (
            100 * (1 - avg by (instance, server_id, application) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
          )
          or
          (
            100 * (1 - avg by (instance, server_id, application) (rate(windows_cpu_time_total{mode="idle"}[5m]))) > 85
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU {{ $labels.server_id }} di atas 85%"
          description: "Penggunaan CPU {{ $value | humanize }}% selama 10 menit."

  - name: ram-storage
    rules:
      - alert: RamKritis
        expr: |
          (
            100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
          )
          or
          (
            100 * (1 - windows_memory_available_bytes / windows_cs_physical_memory_bytes) > 90
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RAM kritis di {{ $labels.server_id }}"
          description: "RAM terpakai {{ $value | humanize }}%."

      - alert: RamTinggi
        expr: |
          (
            100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 80
          )
          or
          (
            100 * (1 - windows_memory_available_bytes / windows_cs_physical_memory_bytes) > 80
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM tinggi di {{ $labels.server_id }}"
          description: "RAM terpakai {{ $value | humanize }}%."

      - alert: StorageKritis
        expr: |
          (
            100 - (
              100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
            ) > 90
          )
          or
          (
            100 - (
              100 * windows_logical_disk_free_bytes{volume=~"[A-Z]:"}
              / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}
            ) > 90
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Storage kritis {{ $labels.mountpoint }}{{ $labels.volume }} di {{ $labels.server_id }}"
          description: "Disk {{ $labels.mountpoint }}{{ $labels.volume }} terpakai {{ $value | humanize }}%."

      - alert: StorageTinggi
        expr: |
          (
            100 - (
              100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
            ) > 80
          )
          or
          (
            100 - (
              100 * windows_logical_disk_free_bytes{volume=~"[A-Z]:"}
              / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}
            ) > 80
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Storage tinggi {{ $labels.mountpoint }}{{ $labels.volume }} di {{ $labels.server_id }}"
          description: "Disk {{ $labels.mountpoint }}{{ $labels.volume }} terpakai {{ $value | humanize }}%."

      - alert: InodeHampirHabis
        expr: |
          100 * (1 - node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
          / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|devtmpfs"}) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Inode hampir habis di {{ $labels.server_id }}:{{ $labels.mountpoint }}"
          description: "Inode terpakai {{ $value | humanize }}%."

  - name: service
    rules:
      # Service yang dipantau (expected) mati → FIRING.
      # Saat service UP lagi (lrt_service_up==1), kondisi hilang → alert RESOLVED otomatis.
      - alert: ServiceTidakAktif
        expr: |
          max by (instance, server_id, application, lokasi, name) (
            lrt_service_expected == 1
            and on(instance, name) lrt_service_up == 0
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service DOWN: {{ $labels.name }} di {{ $labels.server_id }}"
          description: "Service {{ $labels.name }} di {{ $labels.instance }} mati. Alert hilang otomatis setelah service UP kembali."

      # Probe HTTP/TCP: hanya jika probe PERNAH sukses lalu gagal.
      # Target yang dari awal tidak merespons (belum service / salah URL) tidak di-alert.
      - alert: ServiceDown
        expr: |
          (
            probe_success == 0
          )
          and
          (
            max_over_time(probe_success[2d]) == 1
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Probe service gagal: {{ $labels.instance }}"
          description: "Health check {{ $labels.job }} ke {{ $labels.instance }} gagal (sebelumnya pernah OK)."

      - alert: ServiceLambat
        expr: |
          (
            probe_duration_seconds > 2
          )
          and
          (
            probe_success == 1
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service lambat: {{ $labels.instance }}"
          description: "Waktu respons {{ $value | humanize }}s."

  - name: proses-abnormal
    rules:
      - alert: ProsesCpuAbnormal
        expr: sum by (instance, server_id, groupname) (rate(namedprocess_namegroup_cpu_seconds_total[5m])) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proses CPU abnormal: {{ $labels.groupname }}"
          description: "{{ $labels.groupname }} di {{ $labels.server_id }} memakai CPU {{ $value | humanize }}% selama 5 menit."

      - alert: ProsesMemoriAbnormal
        expr: |
          (
            namedprocess_namegroup_memory_bytes{memtype="resident"}
            / on (server_id) group_left
              node_memory_MemTotal_bytes
          ) * 100 > 35
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Proses RAM abnormal: {{ $labels.groupname }}"
          description: "{{ $labels.groupname }} memakai {{ $value | humanize }}% RAM server."

      - alert: ProsesZombie
        expr: namedprocess_namegroup_zombie_count > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Ada proses zombie di {{ $labels.server_id }}"
          description: "Group {{ $labels.groupname }} punya {{ $value }} proses zombie."

      - alert: JumlahProsesTinggi
        expr: namedprocess_namegroup_num_procs > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Jumlah proses {{ $labels.groupname }} tidak wajar"
          description: "{{ $labels.groupname }} di {{ $labels.server_id }} memiliki {{ $value }} proses."

      - alert: ThreadTersumbat
        expr: node_processes_state{state="D"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Banyak proses D-state di {{ $labels.server_id }}"
          description: "{{ $value }} proses uninterruptible sleep (I/O hang)."
