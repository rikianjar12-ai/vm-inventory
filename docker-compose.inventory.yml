# Inventory + tombol Grafana. Jalankan di server pantauan (192.168.38.11):
#   docker compose -f docker-compose.inventory.yml up -d --build
services:
  inventory-db:
    image: postgres:16-alpine
    container_name: lrt-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vm_inventory
    volumes:
      - inventory-pg:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  inventory-app:
    build: .
    container_name: lrt-inventory-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@inventory-db:5432/vm_inventory
      GRAFANA_URL: http://192.168.38.11:3001
      GRAFANA_DASHBOARD_UID: lrt-server-health
      PROMETHEUS_URL: http://prometheus:9090
      APP_PUBLIC_HOST: 192.168.38.11
    depends_on:
      - inventory-db
    networks:
      - default
      - monitoring

networks:
  monitoring:
    external: true
    name: lrt-monitoring_default

volumes:
  inventory-pg:
